{% extends "base.html" %}
{% block title %}Check your email · Leafmail{% endblock %}
{% block content %}
<section class="panel">
  <h1>Check your email</h1>
  <p class="lead">
    We sent a verification link to <strong>{{ email }}</strong>.
    With the console email backend, look for the link in the terminal running the app.
  </p>
  <div class="actions">
    <a class="btn" href="{% url 'login' %}">Go to login</a>
  </div>
</section>
{% endblock %}
